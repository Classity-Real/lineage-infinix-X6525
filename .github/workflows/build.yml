name: Build Lineage Recovery

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          overprovision-lvm: 'true'

      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses6 \
            lib32ncurses-dev libncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Sync source (minimal manifest)
        run: |
          mkdir -p ~/lineage && cd ~/lineage
          export PATH=~/bin:$PATH
          git config --global user.name "Build"
          git config --global user.email "build@github.com"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1 --depth=1 --partial-clone --clone-filter=blob:limit=10M
          repo sync -c -g default,-cts,-developers,-device,-qcom,-vts,-trusty \
            --no-clone-bundle --no-tags --prune --force-sync --retry-fetches=3 -j2

      - name: Clone device tree
        run: |
          cd ~/lineage
          git clone https://github.com/${{ github.repository }}.git device/infinix/X6525

      - name: Decompress kernel
        run: |
          cd ~/lineage/device/infinix/X6525/prebuilt
          gunzip -f kernel.gz

      - name: Build vendorbootimage
        run: |
          cd ~/lineage
          export PATH=~/bin:$PATH
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch lineage_X6525-eng
          make vendorbootimage -j$(nproc)

      - name: Upload vendor_boot
        uses: actions/upload-artifact@v4
        with:
          name: lineage-recovery-vendor_boot
          path: ~/lineage/out/target/product/X6525/vendor_boot.img
